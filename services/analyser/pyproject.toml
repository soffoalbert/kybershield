[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kybershield-analyser"
version = "0.1.0"
description = "Rule-based risk analysis and alerting for agent activity events"
requires-python = ">=3.12"
dependencies = [
    "kybershield-pycommon",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
analyser = "analyser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running PostgreSQL instance",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # typer's documented idiom is a call in the argument default.
    "B008",
    # Scaffold-only: stub bodies do not yet reference every import they will
    # need. Drop this entry once the implementations land.
    "F401",
]
