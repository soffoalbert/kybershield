[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kybershield-analyser"
version = "0.1.0"
description = "Rule-based risk analysis and alerting for agent activity events"
requires-python = ">=3.12"
dependencies = [
    "kybershield-pycommon",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # starlette's TestClient prefers httpx2 and warns when only httpx is present.
    "httpx2>=2.12",
    "ruff>=0.7",
]

[project.scripts]
analyser = "analyser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running PostgreSQL instance",
]
addopts = "--cov=analyser --cov=pycommon --cov-report=term-missing"
filterwarnings = [
    "error",
    # starlette 1.6.0 touches the deprecated anyio.abc.BlockingPortal alias at
    # import time in its own testclient module; nothing we can do from here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # typer's documented idiom is a call in the argument default.
    "B008",
]
