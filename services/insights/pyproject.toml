[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kybershield-insights"
version = "0.1.0"
description = "Read-only risk insights over agent events and alerts"
requires-python = ">=3.12"
dependencies = [
    "kybershield-pycommon",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    # starlette's TestClient prefers httpx2 and warns when only httpx is present.
    "httpx2>=2.12",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a running PostgreSQL instance",
]
addopts = "--cov=insights --cov=pycommon --cov-report=term-missing"
filterwarnings = [
    "error",
    # starlette 1.6.0 touches the deprecated anyio.abc.BlockingPortal alias at
    # import time in its own testclient module; nothing we can do from here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's documented idiom is a call in the argument default.
    "B008",
    # PEP 695 generics on a pydantic BaseModel are not reliably supported yet;
    # Generic[T] is the safe spelling.
    "UP046",
]
