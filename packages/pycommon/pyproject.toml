[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kybershield-pycommon"
version = "0.1.0"
description = "Shared entities, settings, and database helpers for the KyberShield Python services"
requires-python = ">=3.12"
dependencies = [
    # `errors` builds the shared HTTP envelope, so FastAPI is a real
    # dependency of this package rather than only of its consumers.
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pycommon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
